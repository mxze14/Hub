<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Workout Split</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: split name on top, then seven day cards in a responsive grid, today highlighted, each with its exercise rows and an add row. Same dark cyberpunk look as the rest of the hub. */
:root{color-scheme:dark;
--bg:#0b0720;--panel:#120a2e;--panel2:#190f3d;--ink:#f3ecff;--mute:#a89cd0;--line:#3a2680;--accent:#b36bff;--cyan:#4de2ff;--hot:#ff4fd8;--lime:#9dff7a;--bad:#ff5c78;--on-accent:#0a0620;
--display:"Chakra Petch",system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:500;font-size:15px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;
background-image:radial-gradient(ellipse at 80% -10%,rgba(179,107,255,.22),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(255,79,216,.12),transparent 50%)}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
h1{margin:0;font-size:26px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 18px rgba(179,107,255,.8),2px 0 rgba(255,79,216,.5),-2px 0 rgba(77,226,255,.4)}
.crumb{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.note{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--mute);border:1px solid var(--line);background:var(--panel);padding:9px 12px}
.note b{color:var(--cyan);font-weight:400}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--accent);padding:8px 14px;color:var(--ink)}
.btn:hover{background:var(--accent);color:var(--on-accent)}
.btn.pri{background:var(--accent);color:var(--on-accent)}.btn.pri:hover{background:var(--cyan);border-color:var(--cyan)}
.btn.ghost{border-color:var(--line);color:var(--mute)}
.btn.sm{padding:4px 9px;font-size:11px;border-color:var(--line);color:var(--mute)}.btn.sm:hover{background:var(--bad);border-color:var(--bad);color:#fff}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-family:var(--mono);font-weight:400}
label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);min-width:0;flex:1 1 100px}
input,select{background:var(--bg);border:1px solid var(--line);padding:8px 10px;min-width:0;width:100%;font-size:15px}
input:focus,select:focus{border-color:var(--cyan);outline:none}
form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);text-align:center}
.ex{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);border:1px dashed var(--mute);padding:0 4px;margin-left:8px;font-weight:400}
.ai{border:1px dashed var(--accent);padding:16px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.ai b{color:var(--ink);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;font-size:12px;font-weight:400}
.legend{font-family:var(--mono);font-size:11px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:12px}
.day{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day.today{border-color:var(--cyan);box-shadow:0 0 22px -10px var(--cyan)}
.day.rest{opacity:.8}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dn{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hot)}
.today .dn::after{content:" · today";color:var(--cyan)}
.nm{font-size:18px;font-weight:700;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:2px 0}
.rows{display:flex;flex-direction:column;gap:4px}
.ex-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 9px;background:var(--panel2);border-left:2px solid var(--accent)}
.ex-r .t{overflow-wrap:anywhere;font-weight:600}.ex-r button{grid-column:2;grid-row:1/3;align-self:center}
.ex-r .s{grid-column:1;font-family:var(--mono);color:var(--cyan);font-variant-numeric:tabular-nums;white-space:nowrap}
.add{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px}.add input:first-child{grid-column:1/-1}
.add input{padding:6px 8px;font-size:14px}

</style>
<div class="wrap">
  <header><h1>Workout Split</h1><div class="crumb">Hub / Fitness / Workout split</div></header>
  <div class="note" id="note"></div>
  <div class="card"><div class="top">
    <label style="flex:2 1 220px">Split name<input id="sn" placeholder="e.g. Push / Pull / Legs"></label>
    <label style="flex:3 1 260px">Notes<input id="sx" placeholder="e.g. 6 days, progressive overload on compounds"></label>
  </div></div>
  <div class="days" id="days"></div>
  <div class="ai"><b>AI suggestions</b>Reserved for your independent AI. Once it is connected it will read your goal and propose a split here. Nothing is suggested yet.</div>
</div>
<script>
function $(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function uid(){return Math.random().toString(36).slice(2,9)}
function noteBar(S,KEY,clear){var note=document.getElementById("note");note.textContent="";var sp=$("span");sp.innerHTML="Saved in <b>this browser only</b> for now. Everything here is entered by hand.";note.appendChild(sp);
  if(clear.has()){var b=$("button","btn ghost","Clear example data");b.type="button";b.onclick=clear.run;note.appendChild(b)}}
(function(){
var KEY="hub.fitness.split.v1",S,DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
function ex(n,s,r,l){return{id:uid(),n:n,s:s,r:r,l:l,ex:1}}
if(!S||!S.days)S={name:"Push / Pull / Legs",notes:"Example split. Replace it with yours.",days:[
 {name:"Push",rest:0,ex:[ex("Barbell bench press",4,"6-8","185 lb"),ex("Overhead press",3,"8-10","95 lb"),ex("Cable fly",3,"12-15","30 lb")]},
 {name:"Pull",rest:0,ex:[ex("Weighted pull-up",4,"6-8","+25 lb"),ex("Barbell row",3,"8-10","155 lb")]},
 {name:"Legs",rest:0,ex:[ex("Back squat",4,"5-8","245 lb"),ex("Romanian deadlift",3,"8-10","205 lb")]},
 {name:"Push",rest:0,ex:[]},{name:"Pull",rest:0,ex:[]},{name:"Legs",rest:0,ex:[]},{name:"Rest",rest:1,ex:[]}]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function has(){return S.days.some(function(d){return d.ex.some(function(e){return e.ex})})}
function render(){
  noteBar(S,KEY,{has:has,run:function(){S.days.forEach(function(d){d.ex=d.ex.filter(function(e){return!e.ex})});save();render()}});
  var sn=document.getElementById("sn"),sx=document.getElementById("sx");sn.value=S.name||"";sx.value=S.notes||"";
  sn.onchange=function(){S.name=sn.value;save()};sx.onchange=function(){S.notes=sx.value;save()};
  var G=document.getElementById("days");G.textContent="";var today=(new Date().getDay()+6)%7;
  S.days.forEach(function(d,i){
    var c=$("div","day"+(i===today?" today":"")+(d.rest?" rest":"")),h=$("div","dh");h.appendChild($("span","dn",DAYS[i]));
    var rb=$("button","btn sm",d.rest?"Make training day":"Make rest day");rb.type="button";rb.onclick=function(){d.rest=d.rest?0:1;save();render()};h.appendChild(rb);c.appendChild(h);
    var nm=$("input","nm");nm.value=d.name;nm.setAttribute("aria-label",DAYS[i]+" name");nm.onchange=function(){d.name=nm.value;save()};c.appendChild(nm);
    if(!d.rest){var R=$("div","rows");
      if(!d.ex.length)R.appendChild($("div","empty","No exercises yet."));
      d.ex.forEach(function(e){var r=$("div","ex-r"),t=$("div","t",e.n);if(e.ex)t.appendChild($("span","ex","EXAMPLE"));r.appendChild(t);r.appendChild($("div","s",(e.s||"–")+" × "+(e.r||"–")+(e.l?" @ "+e.l:"")));
        var x=$("button","btn sm","Delete");x.type="button";x.setAttribute("aria-label","Delete "+e.n);x.onclick=function(){d.ex=d.ex.filter(function(y){return y.id!==e.id});save();render()};r.appendChild(x);R.appendChild(r)});
      c.appendChild(R);
      var f=$("form","add");f.innerHTML='<input placeholder="Exercise" required aria-label="Exercise"><input placeholder="Sets" inputmode="numeric" aria-label="Sets"><input placeholder="Reps" aria-label="Reps"><input placeholder="Load" aria-label="Load"><button class="btn pri" type="submit">Add</button>';
      f.onsubmit=function(ev){ev.preventDefault();var v=f.querySelectorAll("input");d.ex.push({id:uid(),n:v[0].value.trim(),s:v[1].value.trim(),r:v[2].value.trim(),l:v[3].value.trim()});save();render()};c.appendChild(f)}
    else c.appendChild($("div","legend","Rest day. Nothing planned."));
    G.appendChild(c)})}
render();
})();
</script>

</body></html>
