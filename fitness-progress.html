<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Fitness Progress</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: section rail on the left (one section per kind of data), the open section on the right with chart, entry form and history. Single dark cyberpunk look to match the hub. */
:root{color-scheme:dark;
--bg:#0b0720;--panel:#120a2e;--panel2:#190f3d;--ink:#f3ecff;--mute:#a89cd0;--line:#3a2680;--accent:#b36bff;--cyan:#4de2ff;--hot:#ff4fd8;--bad:#ff5c78;--on-accent:#0a0620;
--display:"Chakra Petch",system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:500;font-size:15px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;
background-image:radial-gradient(ellipse at 80% -10%,rgba(179,107,255,.22),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(255,79,216,.12),transparent 50%)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
h1{margin:0;font-size:26px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 18px rgba(179,107,255,.8),2px 0 rgba(255,79,216,.5),-2px 0 rgba(77,226,255,.4)}
.crumb{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.note{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);background:var(--panel);padding:9px 12px}
.note b{color:var(--cyan);font-weight:400}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--accent);padding:8px 14px;color:var(--ink)}
.btn:hover{background:var(--accent);color:var(--on-accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover{background:var(--cyan);border-color:var(--cyan)}
.btn.ghost{border-color:var(--line);color:var(--mute)}
.btn.del{border-color:transparent;color:var(--mute);padding:4px 8px}.btn.del:hover{background:var(--bad);color:#fff}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:800px){.layout{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex;flex-direction:column;gap:6px}
@media (max-width:800px){.rail{flex-direction:row;overflow-x:auto;padding-bottom:4px}.rail .tab{flex:0 0 auto}}
.tab{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);padding:11px 12px;font-weight:600;letter-spacing:.04em}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--hot);color:var(--hot);padding:1px 5px;white-space:nowrap}
.tab[aria-selected="true"] .tag{border-color:var(--on-accent);color:var(--on-accent)}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-family:var(--mono);font-weight:400}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1 1 130px;border:1px solid var(--line);background:var(--panel2);padding:10px 12px}
.stat .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--mute);font-weight:500}
.up{color:var(--hot)}.dn{color:var(--cyan)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--mute)}
form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);min-width:0}
input,select{background:var(--bg);border:1px solid var(--line);padding:8px 10px;min-width:0;width:100%;font-size:15px}
input:focus,select:focus{border-color:var(--cyan);outline:none}
.fld{flex:1 1 110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:100%}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:400}
.photo{position:relative;border:1px solid var(--line);background:var(--panel2)}
.photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.photo .cap{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-family:var(--mono);font-size:12px;gap:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0}.cmp figcaption{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line)}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);text-align:center}
.ex{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);border:1px dashed var(--mute);padding:0 4px;margin-left:6px}
.msg{font-family:var(--mono);font-size:12px;color:var(--bad);min-height:1em}
.mk{margin-bottom:14px}.mk h3{margin:0 0 6px;font-size:15px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.mk h3 span{font-family:var(--mono);font-size:12px;color:var(--mute);font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
