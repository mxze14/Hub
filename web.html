<title>Hub Web</title>

<style>
/* Layout: night-city header band, then one radial star map (hub core, 8 category rings, 33 app stars) in a framed panel, then the link ledgers. Single dark look on purpose. */
:root{color-scheme:dark;
--bg:#08050f;--panel:#0d0818;--ink:#ece6fb;--mute:#9b90ba;--line:#2a1f48;
--violet:#a76bff;--violet-hi:#c7a0ff;--violet-deep:#5b21b6;--tower:#120a24;--tower-back:#1c1040;
--blue:#3dc8ff;--red:#ff4f6d;
--display:"Rajdhani",system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,monospace}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:500;
padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 24px}
h1{font-size:34px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin:0;text-shadow:0 0 18px rgba(167,107,255,.55)}
.stat{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--violet-hi);text-transform:uppercase}
p.sub{margin:6px 0 0;color:var(--mute);font-size:16px;max-width:62ch;line-height:1.45;font-weight:500}
.city{display:block;width:100%;height:92px;border-bottom:1px solid var(--violet);box-shadow:0 10px 26px -14px var(--violet)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar button{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--panel);border:1px solid var(--violet-deep);border-radius:2px;padding:8px 14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.bar button:hover{border-color:var(--violet)}
.bar button[aria-pressed="false"]{opacity:.42}
.bar button:focus-visible,.app:focus-visible{outline:2px solid var(--violet-hi);outline-offset:3px}
.sw{width:20px;height:0;border-top:3px solid;box-shadow:0 0 8px currentColor}
.sw.dash{border-top-style:dashed}
.sw.b{border-color:var(--blue);color:var(--blue)}
.sw.r{border-color:var(--red);color:var(--red)}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);overflow-x:auto}
.panel::before,.panel::after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--violet);pointer-events:none}
.panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
svg#map{display:block;width:100%;min-width:760px;height:auto}
.hint{display:none;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
@media (max-width:900px){.hint{display:block}}
.spoke{stroke:#5530a8;stroke-width:1;fill:none;opacity:.7}
.ring{fill:none;stroke:var(--violet);stroke-width:1;stroke-dasharray:2 7;opacity:.28}
.lk{fill:none;stroke-width:2;stroke-linecap:round}
.lk.b{stroke:var(--blue)}.lk.r{stroke:var(--red)}
.lk.inf{stroke-dasharray:7 6}
.dim{opacity:.1}
.star{fill:#fff}
.tw{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.app{cursor:default}
.app .halo{fill:none;stroke:var(--violet);stroke-width:1;opacity:.45}
.app .core{fill:var(--violet-hi);filter:url(#glow)}
.app text{font-size:14px;fill:var(--ink);font-family:var(--display);font-weight:500;letter-spacing:.02em}
.app.fut .core{fill:none;stroke:var(--mute);stroke-width:1.5;filter:none}
.app.fut .halo{opacity:.2}
.app.fut text{fill:var(--mute)}
.cat circle.body{fill:var(--tower);stroke:var(--violet);stroke-width:1.5;filter:url(#glow)}
.cat circle.in{fill:none;stroke:var(--violet);stroke-width:1;stroke-dasharray:3 4;opacity:.5}
.cat text{font-size:11px;font-weight:600;fill:var(--ink);text-anchor:middle;font-family:var(--display);letter-spacing:.03em}
.hub circle.core{filter:url(#glow)}
.hub circle.pulse{fill:none;stroke:var(--violet);stroke-width:1.5;transform-origin:550px 550px;animation:pl 3.6s ease-out infinite}
@keyframes pl{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.hub text{fill:#fff;font-size:20px;font-weight:600;letter-spacing:.2em;text-anchor:middle;font-family:var(--display)}
@media (prefers-reduced-motion:reduce){.tw,.hub circle.pulse{animation:none}.hub circle.pulse{opacity:.35}}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px}
.lists section{min-width:0}
h2{font-size:16px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;display:flex;gap:10px;align-items:center}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
li{font-size:15px;line-height:1.35;display:flex;gap:12px;align-items:baseline;padding-bottom:7px;border-bottom:1px solid var(--line)}
li .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--violet-hi);min-width:74px;text-transform:uppercase;flex:none}
li .tag.inf{color:var(--mute)}
li .why{color:var(--mute)}
#cityart{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(rgba(8,4,24,.55),rgba(8,4,24,0) 30%),radial-gradient(ellipse at 50% 50%,rgba(8,4,24,0) 35%,rgba(8,4,24,.5) 100%)}
.wrap{position:relative;z-index:1}
.panel{background:rgba(9,5,26,.78)!important}
@supports (backdrop-filter:blur(2px)){.panel{background:rgba(9,5,26,.6)!important;backdrop-filter:blur(8px)}}
.car{animation:drift var(--d,30s) linear infinite;animation-delay:var(--dl,0s)}.car.rev{animation-direction:reverse}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(1740px)}}
.bk{animation:bk 1.8s steps(1) infinite}@keyframes bk{0%{opacity:1}55%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.car,.bk{animation:none}}
</style>

    <div>

  </div>
</div>

  var c=document.getElementById("city"),r=rng(7);
  var layers=[{fill:"#1c1040",min:16,max:58,strip:.35},{fill:"#120a24",min:14,max:84,strip:.65}];
  layers.forEach(function(ly){
    var x=-6;
    while(x<1106){
      var w=14+Math.floor(r()*22),h=ly.min+Math.floor(r()*(ly.max-ly.min));
      mk("rect",{x:x,y:92-h,width:w,height:h,fill:ly.fill},c);
      for(var y=92-h+6;y<88;y+=5+Math.floor(r()*5)){
        if(r()<.55)mk("rect",{x:x+3,y:y,width:Math.max(4,w-6-Math.floor(r()*6)),height:1.4,fill:"#3dc8ff",opacity:(ly.strip*(.4+r()*.6)).toFixed(2)},c);
      }
      if(r()<.12)mk("circle",{cx:x+w/2,cy:92-h-2,r:1.8,fill:"#ff4f6d"},c);
      x+=w+Math.floor(r()*4);
    }
  });
})();

/* map */
var svg=document.getElementById("map"),CX=550,CY=550,R1=205,R2=335;
var defs=mk("defs",{},svg);
var gl=mk("filter",{id:"glow",x:"-60%",y:"-60%",width:"220%",height:"220%"},defs);
mk("feGaussianBlur",{stdDeviation:"3.2",result:"b"},gl);
var mg=mk("feMerge",{},gl);mk("feMergeNode",{in:"b"},mg);mk("feMergeNode",{in:"SourceGraphic"},mg);
var gl2=mk("filter",{id:"glow2",x:"-10%",y:"-10%",width:"120%",height:"120%"},defs);
mk("feGaussianBlur",{stdDeviation:"2.4",result:"b"},gl2);
var mg2=mk("feMerge",{},gl2);mk("feMergeNode",{in:"b"},mg2);mk("feMergeNode",{in:"SourceGraphic"},mg2);
var rg=mk("radialGradient",{id:"nebula",cx:"50%",cy:"50%",r:"50%"},defs);
mk("stop",{offset:"0","stop-color":"#6a2bd9","stop-opacity":".38"},rg);
mk("stop",{offset:"1","stop-color":"#6a2bd9","stop-opacity":"0"},rg);
var hg=mk("radialGradient",{id:"core",cx:"50%",cy:"45%",r:"60%"},defs);
mk("stop",{offset:"0","stop-color":"#a76bff"},hg);
mk("stop",{offset:"1","stop-color":"#4c1d95"},hg);
mk("rect",{x:0,y:0,width:1100,height:1100,fill:"url(#nebula)"},svg);

var gStars=mk("g",{},svg),sr=rng(42);
for(var i=0;i<190;i++){
  var big=sr()<.08;
  var st=mk("circle",{cx:(sr()*1100).toFixed(1),cy:(sr()*1100).toFixed(1),r:big?1.7:(.5+sr()*.7).toFixed(2),class:"star"+(sr()<.12?" tw":""),opacity:(.25+sr()*.6).toFixed(2)},gStars);
  if(st.getAttribute("class").indexOf("tw")>-1)st.style.animationDelay=(sr()*4).toFixed(1)+"s";
}
mk("circle",{cx:CX,cy:CY,r:R1,class:"ring"},svg);
mk("circle",{cx:CX,cy:CY,r:R2,class:"ring"},svg);
var gS=mk("g",{},svg),gL=mk("g",{filter:"url(#glow2)"},svg),gN=mk("g",{},svg);

var nm={},pos={},total=0;
CATS.forEach(function(c){total+=c.a.length});
var gap=2.4,slots=total+CATS.length*gap,step=Math.PI*2/slots,ang=-Math.PI/2;
CATS.forEach(function(c){
  ang+=gap*step/2;var first=ang,aps=[];
  c.a.forEach(function(a){var th=ang+step/2;aps.push([a,th]);ang+=step});
  var mid=(first+ang)/2,cx=CX+R1*Math.cos(mid),cy=CY+R1*Math.sin(mid);
  mk("line",{x1:CX,y1:CY,x2:cx,y2:cy,class:"spoke"},gS);
  aps.forEach(function(p){var th=p[1],x=CX+R2*Math.cos(th),y=CY+R2*Math.sin(th);pos[p[0][0]]=[x,y,th,c.fut];nm[p[0][0]]=p[0][1];
    mk("line",{x1:cx,y1:cy,x2:x,y2:y,class:"spoke"},gS)});
  var g=mk("g",{class:"cat"},gN);
  mk("circle",{cx:cx,cy:cy,r:46,class:"body"},g);
  mk("circle",{cx:cx,cy:cy,r:40,class:"in"},g);
  mk("text",{x:cx,y:cy+4},g).textContent=c.n;
  ang+=gap*step/2;
});
var hub=mk("g",{class:"hub"},gN);
mk("circle",{cx:CX,cy:CY,r:46,class:"pulse"},hub);
mk("circle",{cx:CX,cy:CY,r:46,class:"core",fill:"url(#core)",stroke:"#c7a0ff","stroke-width":1.5},hub);
mk("text",{x:CX,y:CY+7},hub).textContent="HUB";

var lines=[];
L.forEach(function(l){
  var a=pos[l[0]],b=pos[l[1]];
  var mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,f=l[2]==="b"?0.35:0.55;
  var p=mk("path",{d:"M"+a[0]+","+a[1]+" Q"+(CX+(mx-CX)*f)+","+(CY+(my-CY)*f)+" "+b[0]+","+b[1],class:"lk "+l[2]+(l[3]?"":" inf")},gL);
  lines.push({p:p,l:l});
});
var apps={};
Object.keys(pos).forEach(function(id){
  var p=pos[id],x=p[0],y=p[1],right=Math.cos(p[2])>=0;
  var g=mk("g",{class:"app"+(p[3]?" fut":""),tabindex:"0"},gN);
  mk("circle",{cx:x,cy:y,r:10,class:"halo"},g);
  mk("circle",{cx:x,cy:y,r:4.5,class:"core"},g);
  var deg=p[2]*180/Math.PI,flip=!right;if(flip)deg+=180;
  mk("text",{x:flip?-17:17,y:5,"text-anchor":flip?"end":"start",transform:"translate("+x.toFixed(1)+","+y.toFixed(1)+") rotate("+deg.toFixed(1)+")"},g).textContent=nm[id]+(p[3]?" (future)":"");
  apps[id]=g;
  var on=function(){hi(id)},off=function(){hi(null)};
  g.addEventListener("mouseenter",on);g.addEventListener("mouseleave",off);g.addEventListener("focus",on);g.addEventListener("blur",off);
});
document.getElementById("stat").textContent=CATS.length+" categories / "+Object.keys(pos).length+" apps / "+L.length+" links";

var S={b:true,r:true,i:true};
function vis(o){return S[o.l[2]]&&(S.i||o.l[3])}
function hi(id){
  var keep={};
  lines.forEach(function(o){
    var show=vis(o),rel=id&&(o.l[0]===id||o.l[1]===id);
    o.p.style.display=show?"":"none";
    o.p.classList.toggle("dim",!!id&&!rel);
    if(id&&rel&&show){keep[o.l[0]]=1;keep[o.l[1]]=1}
  });
  Object.keys(apps).forEach(function(k){apps[k].classList.toggle("dim",!!id&&!keep[k]&&k!==id)});
}
function toggle(btn,key){btn.addEventListener("click",function(){S[key]=!S[key];btn.setAttribute("aria-pressed",S[key]);hi(null);fill()})}
toggle(document.getElementById("tb"),"b");toggle(document.getElementById("tr"),"r");toggle(document.getElementById("ti"),"i");
function fill(){
  ["b","r"].forEach(function(t){
    var ul=document.getElementById(t==="b"?"lb":"lr");ul.innerHTML="";
    L.forEach(function(l){
      if(l[2]!==t||!vis({l:l}))return;
      var li=document.createElement("li");
      var tag=document.createElement("span");tag.className="tag"+(l[3]?"":" inf");tag.textContent=l[3]?"your words":"inferred";
      var tx=document.createElement("span");
      tx.textContent=nm[l[0]]+" ↔ "+nm[l[1]]+" ";
      var w=document.createElement("span");w.className="why";w.textContent="– "+l[4];
      tx.appendChild(w);li.appendChild(tag);li.appendChild(tx);ul.appendChild(li);
    });
  });
}
fill();
</script>

</body></html>
