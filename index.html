<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Hub Neon City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&text=%E3%83%8D%E3%82%AA%E3%83%B3%E9%9B%BB%E8%84%B3%E3%83%8F%E3%83%96%E5%A4%9C%E6%8E%A5%E7%B6%9A&display=swap">
<style>
/* Concept: a flat-shaded anime night city fills the whole page (sky bands, moon, cel-lit towers with strip lights, katakana signs, drifting traffic). The hub web sits in front as a circuit board: neon traces with data pulses run from the hub to category tags to app nodes. */
:root{color-scheme:dark;
--bg:#0b0720;--ink:#f3ecff;--mute:#bdb0e0;--line:rgba(179,107,255,.42);--accent:#b36bff;--accent2:#4de2ff;--hot:#ff4fd8;--card:rgba(14,8,40,.8);--hover:rgba(179,107,255,.2);--on-accent:#0a0620;--danger:#ff5c78;
--font-display:"Chakra Petch",system-ui,sans-serif;--font-mono:"Share Tech Mono",ui-monospace,monospace;--jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;--title-w:600}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-display);font-weight:500;
padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
#cityart{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(rgba(8,4,24,.7),rgba(8,4,24,0) 26%),radial-gradient(ellipse at 50% 55%,rgba(8,4,24,0) 40%,rgba(8,4,24,.55) 100%)}
.wrap{position:relative;z-index:1;max-width:1260px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:baseline;gap:14px}
.jp{font-family:var(--jp);font-weight:700;font-size:15px;color:var(--hot);letter-spacing:.2em;text-shadow:0 0 12px var(--hot)}
h1{font-weight:700;font-size:30px;letter-spacing:.36em;margin:0;text-shadow:0 0 20px rgba(179,107,255,.9),2px 0 rgba(255,79,216,.6),-2px 0 rgba(77,226,255,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);background:rgba(10,5,30,.72);padding:5px 11px;color:var(--mute)}
.chip b{font-weight:400;color:var(--accent2)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;margin-top:10px;align-items:start}
@media (max-width:979px){.stage{grid-template-columns:minmax(0,1fr)}}
svg#web{display:block;width:100%;height:auto;aspect-ratio:1/1}
.side{position:relative;padding:22px;background:rgba(10,5,30,.86);border:1px solid var(--line)}
@supports (backdrop-filter:blur(2px)){.side{background:rgba(10,5,30,.64);backdrop-filter:blur(14px) saturate(1.3)}}
.side::before,.side::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--hot);pointer-events:none}
.side::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.side::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.side .hp-title{text-shadow:0 0 14px rgba(179,107,255,.7);text-transform:uppercase;letter-spacing:.04em}
.below{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:14px;background:rgba(10,5,30,.72);border:1px solid var(--line)}
.cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.hd-btn{background:rgba(14,8,40,.8);border-radius:0;border-bottom:2px solid var(--hot)}
.hl{background:rgba(10,5,30,.7);padding:4px 12px}
.key{display:flex;flex-wrap:wrap;gap:16px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:9px 14px;background:rgba(10,5,30,.66);border:1px solid var(--line)}
.key i{display:inline-block;width:9px;height:9px;margin-right:7px;transform:rotate(45deg);border:1.5px solid var(--accent2)}
.key i.o{background:var(--hot);border-color:var(--hot)}.key i.f{border-color:#8a7bb0;border-style:dashed}
.ring{fill:none;stroke:var(--accent);stroke-width:1;opacity:.28;stroke-dasharray:2 9}
.tr{fill:none;stroke:#8a4dff;stroke-width:1.6;stroke-linejoin:miter;opacity:.85}
.tr.h{stroke:var(--hot);stroke-width:2;opacity:.9}
.pulse{fill:none;stroke:var(--accent2);stroke-width:3;stroke-linecap:round;stroke-dasharray:3 97;animation:pu 4.5s linear infinite}
.pulse.h{stroke:#fff}
@keyframes pu{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.cg{cursor:pointer}
.cg polygon{fill:rgba(10,5,32,.92);stroke:var(--accent);stroke-width:1.6}
.cg text{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;fill:var(--ink);text-anchor:middle}
.cg:hover polygon{fill:rgba(179,107,255,.35)}
.cg.on polygon{fill:var(--accent);stroke:#fff}.cg.on text{fill:var(--on-accent)}
.cg.fut polygon{stroke:#8a7bb0;stroke-dasharray:4 3}.cg.fut text{fill:var(--mute)}
.ap{cursor:pointer}
.ap rect{fill:#0b0524;stroke:var(--accent2);stroke-width:1.6}
.ap text{font-family:var(--font-display);font-weight:500;font-size:14px;fill:var(--ink);paint-order:stroke;stroke:#07041a;stroke-width:4.5px;stroke-linejoin:round}
.ap:hover rect,.ap.on rect{fill:var(--accent2)}
.ap.on text{fill:var(--accent2)}
.ap.fut rect{stroke:#8a7bb0;stroke-dasharray:3 2}.ap.fut text{fill:var(--mute)}
.ap.out rect{stroke:var(--hot)}.ap.out:hover rect,.ap.out.on rect{fill:var(--hot)}
.dim{opacity:.18}
.spin1{transform-origin:550px 550px;animation:sp 40s linear infinite}
.spin2{transform-origin:550px 550px;animation:sp 70s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.hubt{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.22em;fill:#fff;text-anchor:middle}
.hubj{font-family:var(--jp);font-weight:700;font-size:11px;letter-spacing:.3em;fill:var(--hot);text-anchor:middle}
.car{animation:drift var(--d,30s) linear infinite;animation-delay:var(--dl,0s)}
.car.rev{animation-direction:reverse}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(1740px)}}
.bk{animation:bk 1.8s steps(1) infinite}
@keyframes bk{0%{opacity:1}55%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.car,.bk,.pulse,.spin1,.spin2{animation:none}.pulse{display:none}}
.hp{display:flex;flex-direction:column;gap:12px;min-width:0}
.hp-crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-family:var(--font-mono);font-size:12px;color:var(--mute);letter-spacing:.04em}
.hp-crumb{background:none;border:0;color:var(--accent);cursor:pointer;padding:3px 4px;font:inherit}
.hp-crumb:hover{text-decoration:underline}
.hp-sep{color:var(--mute)}
.hp-title{font-family:var(--font-display);font-size:28px;font-weight:var(--title-w,600);margin:0;line-height:1.12;text-wrap:balance}
.hp-tags{display:flex;flex-wrap:wrap;gap:6px}
.hp-tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);padding:3px 8px;color:var(--mute)}
.hp-tag.out{color:var(--accent2);border-color:var(--accent2)}
.hp-text{color:var(--mute);line-height:1.55;margin:0;font-size:15px;max-width:60ch}
.hp-note{color:var(--mute);font-size:13px;margin:0;line-height:1.45}
.hp-h{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:6px 0 0;font-weight:400}
.hp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hp-list li{border-bottom:1px solid var(--line);padding-bottom:6px;font-size:15px;color:var(--ink)}
.hp-link{background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:2px 0;text-align:left;width:100%}
.hp-link:hover{color:var(--accent)}
.hp-form{display:flex;flex-direction:column;gap:8px}
.hp-form label{font-family:var(--font-mono);font-size:12px;color:var(--mute);letter-spacing:.06em}
.hp-input{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:9px 10px;font:inherit;min-width:0}
.hp-input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hp-btn{background:transparent;color:var(--ink);border:1px solid var(--accent);padding:9px 14px;cursor:pointer;font-family:var(--font-mono);letter-spacing:.07em;text-transform:uppercase;font-size:12px;text-align:left}
.hp-btn:hover{background:var(--hover)}
.hp-btn.go{background:var(--accent);color:var(--on-accent)}
.hp-btn[aria-pressed="true"]{border-color:var(--danger);color:var(--danger)}
.hp-err{color:var(--danger);font-size:13px;min-height:0}
.hp-msg{color:var(--accent2);font-size:13px}
.hp-draft{border:1px dashed var(--line);padding:10px;color:var(--mute);font-size:14px;line-height:1.45}
.hp-src{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-weight:600;font-size:15px;margin-top:4px}
.hp-src.removed .hp-srcname{color:var(--danger)}
.hp-removed{color:var(--danger);font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:400}
.hl{display:none}
.hl-cat{border-bottom:1px solid var(--line)}
.hl-sum{padding:12px 4px;cursor:pointer;font-family:var(--font-display);font-size:18px;color:var(--ink)}
.hl-app{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--line);color:var(--mute);font:inherit;font-size:15px;padding:8px 12px;margin:0 0 2px 6px;cursor:pointer}
.hl-app.on,.hl-app:hover{color:var(--ink);border-left-color:var(--accent)}
.hd{display:flex;flex-wrap:wrap;gap:8px}
.hd-btn{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 14px;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.hd-btn:hover,.hd-btn.on{border-color:var(--accent);color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:759px){.map{display:none!important}.hl{display:block}}

.hp-open{display:inline-block;margin:6px 0 4px;font-family:var(--font-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--on-accent);background:var(--accent2);padding:10px 16px;border:1px solid var(--accent2)}
.hp-open:hover{background:var(--accent);border-color:var(--accent)}
.hp-open:focus-visible{outline:2px solid #fff;outline-offset:2px}

</style>
<svg id="cityart" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
<div class="veil"></div>
<div class="wrap">
  <div class="top">
    <div class="logo"><span class="jp">ハブ</span><h1>HUB</h1></div>
    <div class="chips"><span class="chip">System <b>online</b></span><span class="chip">Mode <b>local only</b></span><span class="chip">Outside <b>pull in only</b></span></div>
  </div>
  <div class="stage">
    <div>
      <div class="map">
        <svg id="web" viewBox="-40 -40 1180 1180" role="group" aria-label="Circuit web. The hub is at the center, categories are tags on the inner ring, apps are nodes on the outer ring."></svg>
        <div class="key"><span><i></i>App</span><span><i class="o"></i>Pulls in from outside</span><span><i class="f"></i>Future</span></div>
      </div>
      <div class="below">
        <div class="hl" id="list"></div>
        <div class="cap">Shared foundations</div>
        <nav class="hd" id="dock" aria-label="Shared foundations"></nav>
      </div>
    </div>
    <aside class="side" id="panel" aria-live="polite"></aside>
  </div>
</div>
<script>
var Hub=(function(){
function A(id,n,d,det,out,fut){return{id:id,n:n,d:d,det:det||[],out:out||"",fut:!!fut}}
var C=[
{id:"cat:eff",n:"Efficiency",d:"Apps that make life easier.",a:[
 A("eff.report","Report Creation","Create a report and review it. Press the check button to confirm it is good and it is filed, named after what it created.",["Create a report","Review it","Check button files it"]),
 A("eff.docs","Document Storage","Its own app inside Efficiency for storing documents.",["Documents"]),
 A("eff.analyzer","Document Analyzer","Pick a document from storage or upload one, then analyze it. Your AI will write the analysis later. The check button files the confirmed analysis to storage.",["Document from storage or upload","Analysis","Check button files it"]),
 A("eff.vault","Vault","Passcode-locked, encrypted storage that only you can open. Private documents go here instead of main storage.",["Passcode","Encrypted documents"])]},
{id:"cat:look",n:"Looksmaxxing",d:"Maximizing facial looks.",a:[
 A("look.scan","Facial Scanner","Takes the pictures, taken or uploaded, under instructions you write. It is the only way photos reach the Facial Analyzer.",["Pictures taken or uploaded","Your capture instructions"]),
 A("look.analyzer","Facial Analyzer","Breaks down the scanned photos and gives a score and feedback, using criteria and an equation only you write. Photos are stored inside it for now.",["Your criteria and equation","Score","Feedback","Stored photos"]),
 A("look.progress","Progress","Keeps the results of each scan so you can track change over time.",["Results per scan","Change over time"]),
 A("look.plan","Planning","Holds the plan you come up with.",["The plan"]),
 A("look.research","Research","Study and research methods of changing facial structure and looks.",["Methods","Studies"])]},
{id:"cat:money",n:"Money",d:"The financial side of life.",a:[
 A("m.proj","Businesses/Projects","Add a business or project to create its profile, with a description. The other Money apps read these profiles.",["Profiles","Descriptions"]),
 A("m.news","News page","Shows your businesses and projects. Open one to see that day's relevant news. You build the news part by hand.",["Business and project tiles","Daily news per item"],"the internet"),
 A("m.breakdown","Document breakdown","Upload documents or presentations and get a breakdown. Works with Money apps only.",["Upload","Breakdown"]),
 A("m.research","Research","Whatever you want to research.",[]),
 A("m.assets","Business Assets","Added by hand. An overview of everything, and you can press into a business or project for specifics.",["Overview","Profile view"]),
 A("m.fin","Business Finances","Added by hand for now. A broad view, and you can press into a business or project for specifics.",["Overview","Profile view"]),
 A("m.docs","Business Documentation","Formation documents, presentations, reports and more, shown together with a specific view per business or project.",["All documents together","View per business or project"])]},
{id:"cat:fit",n:"Fitness",d:"Fitness and food.",a:[
 A("f.supp","Supplements","A list of what you take.",["Your list"]),
 A("f.progress","Progress","Body measurements, weight and body fat percentage.",["Body measurements","Weight","Body fat %"]),
 A("f.steps","Steps counter","Steps taken in the day. Probably fed by an old Apple Watch.",["Steps today"],"a device"),
 A("f.split","Workout Split","Built from your goals by your independent AI plus your input.",["Based on goals"]),
 A("f.macro","Macro breakdown","What to eat to reach the goal.",["Based on goals"]),
 A("f.groc","Groceries","What to buy to reach the goal.",["Based on goals"])]},
{id:"cat:ent",n:"Entertainment",d:"Future. Everything here is built by you, not taken from a ready-made product.",a:[
 A("en.stream","Streaming","Future app.",[],"",1),A("en.music","Music","Future app.",[],"",1),A("en.social","Social hub","Future app.",[],"",1),A("en.news","News","Future app.",[],"",1),A("en.events","Events","Future app.",[],"",1)]},
{id:"cat:know",n:"Knowledge",d:"Study and testing.",a:[
 A("k.study","Study Terminal","Where your study topics live.",["Topics"]),
 A("k.docs","Document Storage","Document storage for Knowledge.",["Documents"]),
 A("k.breakdown","Document breakdown/Research","Break down documents and research.",[]),
 A("k.tests","Tests","Tests created by AI from the topics in the Study Terminal. You take them.",["AI-made tests","Topics from Study Terminal"])]},
{id:"cat:org",n:"Organizational",d:"Future. Needs outside connections first.",a:[
 A("o.email","Email hub","One interface for multiple email connections. Information is pulled in only.",["Email connections"],"the internet",1),
 A("o.cal","Calendar","No details yet.",[],"",1),
 A("o.social","Social media hub","No details yet.",[],"",1)]},
{id:"cat:gold",n:"GoldenEye",d:"Accounts you want to keep track of.",a:[
 A("g.ig","Instagram Handles","Stores Instagram accounts you want to follow later, shown as cards. Entered by hand.",["Profile picture","Username","Follower count","Search criteria: hair color, location, height, body type, eye color, languages"])]},
{id:"cat:sec",n:"Security",d:"Future.",a:[A("s.cams","Cameras","Future app.",[],"",1)]}
];
C.forEach(function(c){c.fut=c.a.every(function(a){return a.fut})});
var FD=[
{id:"fd:docs",n:"Documents",d:"The main storage. Every document is also copied to a small shelf inside its own category. Documents stay when the app that made them is removed."},
{id:"fd:vault",n:"Vault",d:"Sensitive info and pictures. Only you can open it."},
{id:"fd:ai",n:"AI model",d:"Your own independent AI model, shared by the apps."},
{id:"fd:eq",n:"Equations",d:"Equations you save once and run again on newer data."}
];
var H={cats:C,found:FD,apps:{},sel:null,removed:false,ls:[],draft:null,
docs:[{t:"Q3 sales report",src:"eff.report",ex:true},{t:"Formation documents",src:"m.docs",ex:true}]};
C.forEach(function(c){c.a.forEach(function(a){a.cat=c;H.apps[a.id]=a})});
H.select=function(id){H.sel=id||null;H.ls.forEach(function(f){f(H.sel)})};
H.on=function(f){H.ls.push(f)};
H.catOf=function(id){if(H.apps[id])return H.apps[id].cat;for(var i=0;i<C.length;i++)if(C[i].id===id)return C[i];return null};
H.layout=function(cx,cy,R1,R2,gap){
  var total=0;C.forEach(function(c){total+=c.a.length});
  var step=Math.PI*2/(total+C.length*gap),ang=-Math.PI/2,out=[];
  C.forEach(function(c){
    ang+=gap*step/2;var first=ang,ap=[];
    c.a.forEach(function(a){var th=ang+step/2;ap.push({a:a,th:th,x:cx+R2*Math.cos(th),y:cy+R2*Math.sin(th)});ang+=step});
    var mid=(first+ang)/2;
    out.push({c:c,a0:first,a1:ang,mid:mid,x:cx+R1*Math.cos(mid),y:cy+R1*Math.sin(mid),apps:ap});
    ang+=gap*step/2;
  });
  return out;
};
function h(t,cls,tx){var e=document.createElement(t);if(cls)e.className=cls;if(tx!=null)e.textContent=tx;return e}
function btn(tx,cls,fn){var b=h("button",cls,tx);b.type="button";b.addEventListener("click",fn);return b}
function crumbs(parts){var d=h("div","hp-crumbs");parts.forEach(function(p,i){if(i)d.appendChild(h("span","hp-sep","›"));d.appendChild(btn(p[0],"hp-crumb",p[1]))});return d}
function list(items){var u=h("ul","hp-list");items.forEach(function(t){u.appendChild(h("li",null,t))});return u}
function addDoc(t,src){H.docs.push({t:t,src:src,ex:false})}
function docsPanel(p){
  p.appendChild(crumbs([["Hub",function(){H.select(null)}],["Documents",function(){}]]));
  p.appendChild(h("h2","hp-title","Documents"));
  p.appendChild(h("p","hp-text",FD[0].d));
  var pv=btn(H.removed?"Preview: Report Creation removed":"Preview: a removed app","hp-btn",function(){H.removed=!H.removed;H.select(H.sel)});
  pv.setAttribute("aria-pressed",H.removed);p.appendChild(pv);
  p.appendChild(h("p","hp-note","Entries marked example are placeholders, not your documents."));
  p.appendChild(h("h3","hp-h","Main storage"));
  var by={};H.docs.forEach(function(d){(by[d.src]=by[d.src]||[]).push(d)});
  Object.keys(by).forEach(function(src){
    var gone=H.removed&&src==="eff.report",g=h("div","hp-src"+(gone?" removed":""));
    g.appendChild(h("span","hp-srcname",H.apps[src].n));
    if(gone)g.appendChild(h("span","hp-removed","removed, documents stay"));
    p.appendChild(g);
    p.appendChild(list(by[src].map(function(d){return d.t+(d.ex?" (example)":"")})));
  });
  p.appendChild(h("h3","hp-h","Category shelves"));
  var sh={};H.docs.forEach(function(d){var n=H.apps[d.src].cat.n;(sh[n]=sh[n]||[]).push(d)});
  Object.keys(sh).forEach(function(n){
    p.appendChild(h("div","hp-src",n+" shelf"));
    p.appendChild(list(sh[n].map(function(d){return d.t+(d.ex?" (example)":"")+" – copy"})));
  });
}
function reportDemo(p){
  p.appendChild(h("h3","hp-h","Try the flow"));
  var f=h("div","hp-form"),lab=h("label",null,"Report name");lab.setAttribute("for","rp-title");
  var inp=h("input","hp-input");inp.id="rp-title";inp.value=H.draft?H.draft.t:"Q3 sales report";inp.type="text";
  var err=h("div","hp-err"),msg=h("div","hp-msg");msg.setAttribute("aria-live","polite");
  inp.addEventListener("input",function(){err.textContent=""});
  f.appendChild(lab);f.appendChild(inp);
  f.appendChild(btn("Generate draft","hp-btn",function(){
    var v=inp.value.trim();if(!v){err.textContent="Enter a report name first.";return}
    H.draft={t:v};msg.textContent="";H.select(H.sel)}));
  f.appendChild(err);
  if(H.draft){
    f.appendChild(h("div","hp-draft","Draft of “"+H.draft.t+"”. Example draft only. Nothing is saved until you confirm."));
    f.appendChild(btn("✓ Confirm report is good","hp-btn go",function(){
      addDoc(H.draft.t,"eff.report");H.draft=null;H.lastMsg="Filed to main storage and the Efficiency shelf.";H.select(H.sel)}));
  }
  if(H.lastMsg){msg.textContent=H.lastMsg;H.lastMsg=""}

}
