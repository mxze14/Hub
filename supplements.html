<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Fitness Supplements</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a stack of thin horizontal strips, one per supplement, with five fixed columns (name, amount, frequency, duration, length of usage). Same dark cyberpunk look as the rest of the hub. */
:root{color-scheme:dark;
--bg:#0b0720;--panel:#120a2e;--panel2:#190f3d;--ink:#f3ecff;--mute:#a89cd0;--line:#3a2680;--accent:#b36bff;--cyan:#4de2ff;--hot:#ff4fd8;--bad:#ff5c78;--on-accent:#0a0620;
--display:"Chakra Petch",system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:500;font-size:15px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;
background-image:radial-gradient(ellipse at 80% -10%,rgba(179,107,255,.22),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(255,79,216,.12),transparent 50%)}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
h1{margin:0;font-size:26px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 18px rgba(179,107,255,.8),2px 0 rgba(255,79,216,.5),-2px 0 rgba(77,226,255,.4)}
.crumb{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.note{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--mute);border:1px solid var(--line);background:var(--panel);padding:9px 12px}
.note b{color:var(--cyan);font-weight:400}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--accent);padding:8px 14px;color:var(--ink)}
.btn:hover{background:var(--accent);color:var(--on-accent)}
.btn.pri{background:var(--accent);color:var(--on-accent)}.btn.pri:hover{background:var(--cyan);border-color:var(--cyan)}
.btn.ghost{border-color:var(--line);color:var(--mute)}
.btn.sm{padding:4px 9px;font-size:11px;border-color:var(--line);color:var(--mute)}
.btn.sm.d:hover{background:var(--bad);border-color:var(--bad);color:#fff}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-family:var(--mono);font-weight:400}
form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);min-width:0;flex:1 1 140px}
input{background:var(--bg);border:1px solid var(--line);padding:8px 10px;min-width:0;width:100%;font-size:15px}
input:focus{border-color:var(--cyan);outline:none}
.list{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.grid{display:grid;grid-template-columns:minmax(150px,2fr) minmax(90px,1fr) minmax(110px,1.2fr) minmax(100px,1.2fr) minmax(120px,1.2fr) 118px;gap:14px;align-items:center;min-width:760px}
.head{padding:0 14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sl{padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent)}
.sl:hover{border-color:var(--accent);border-left-color:var(--cyan);background:var(--panel2)}
.sl .n{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.sl .u{font-family:var(--mono);color:var(--cyan);font-variant-numeric:tabular-nums}
.sl .act{display:flex;gap:6px;justify-content:flex-end}
.ex{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);border:1px dashed var(--mute);padding:0 4px;margin-left:8px;font-weight:400}
.empty{color:var(--mute);padding:16px;border:1px dashed var(--line);text-align:center}
.hint{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:8px}
</style>
<div class="wrap">
  <header><h1>Supplements</h1><div class="crumb">Hub / Fitness / Supplements</div></header>
  <div class="note" id="note"></div>
  <div class="card"><h2 id="fh">Add a supplement</h2>
    <form class="row" id="f">
      <label style="flex:2 1 180px">Name<input id="f-n" required placeholder="e.g. Creatine monohydrate"></label>
      <label>Amount<input id="f-a" placeholder="e.g. 5 g"></label>
      <label>Frequency<input id="f-f" placeholder="e.g. Daily"></label>
      <label>Duration<input id="f-d" placeholder="e.g. Ongoing, 8 weeks"></label>
      <label>Started on<input id="f-s" type="date"></label>
      <button class="btn pri" type="submit" id="f-b">Add</button>
      <button class="btn ghost" type="button" id="f-c" hidden>Cancel</button>
    </form>
    <div class="hint">Length of usage is worked out from the start date and keeps counting every day.</div>
  </div>
  <div class="list" id="list" aria-label="Supplements"></div>
</div>
<script>
(function(){
var KEY="hub.fitness.supplements.v1",S,editing=null;
function uid(){return Math.random().toString(36).slice(2,9)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function ago(days){var d=new Date();d.setDate(d.getDate()-days);return iso(d)}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.items)S={items:[
 {id:uid(),n:"Creatine monohydrate",a:"5 g",f:"Daily",d:"Ongoing",s:ago(212),ex:1},
 {id:uid(),n:"Vitamin D3",a:"5,000 IU",f:"Daily",d:"12 weeks",s:ago(63),ex:1},
 {id:uid(),n:"Magnesium glycinate",a:"400 mg",f:"Nightly",d:"Ongoing",s:ago(140),ex:1},
 {id:uid(),n:"Fish oil",a:"2 g",f:"With meals, daily",d:"Ongoing",s:ago(9),ex:1}]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function usage(s){
  if(!s)return"–";var p=s.split("-"),a=new Date(+p[0],+p[1]-1,+p[2]),n=new Date(),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(a>b)return"Starts "+a.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  var y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
  if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  var out=[];if(y)out.push(y+" yr");if(m)out.push(m+" mo");if(!y&&d||!out.length)out.push(d+" d");
  return out.join(" ")}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(){
  var L=document.getElementById("list");L.textContent="";
  var note=document.getElementById("note");note.textContent="";
  var sp=el("span");sp.innerHTML="Saved in <b>this browser only</b> for now.";note.appendChild(sp);
  if(S.items.some(function(i){return i.ex})){var b=el("button","btn ghost","Clear example data");b.type="button";b.onclick=function(){S.items=S.items.filter(function(i){return!i.ex});save();render()};note.appendChild(b)}
  if(!S.items.length){L.appendChild(el("div","empty","No supplements yet. Add the first one above."));return}
  var h=el("div","grid head");["Supplement","Amount","Frequency","Duration","Length of usage",""].forEach(function(t){h.appendChild(el("div",null,t))});L.appendChild(h);
  S.items.forEach(function(i){
    var r=el("div","grid sl"),n=el("div","n",i.n);if(i.ex)n.appendChild(el("span","ex","EXAMPLE"));
    r.appendChild(n);r.appendChild(el("div",null,i.a||"–"));r.appendChild(el("div",null,i.f||"–"));r.appendChild(el("div",null,i.d||"–"));
    r.appendChild(el("div","u",usage(i.s)));
    var act=el("div","act"),e=el("button","btn sm","Edit"),d=el("button","btn sm d","Delete");e.type=d.type="button";
    e.onclick=function(){edit(i)};d.onclick=function(){S.items=S.items.filter(function(x){return x.id!==i.id});if(editing===i.id)reset();save();render()};
    act.appendChild(e);act.appendChild(d);r.appendChild(act);L.appendChild(r)})}
var F=document.getElementById("f");
function reset(){editing=null;F.reset();document.getElementById("fh").textContent="Add a supplement";document.getElementById("f-b").textContent="Add";document.getElementById("f-c").hidden=true}
function edit(i){editing=i.id;document.getElementById("f-n").value=i.n;document.getElementById("f-a").value=i.a||"";document.getElementById("f-f").value=i.f||"";document.getElementById("f-d").value=i.d||"";document.getElementById("f-s").value=i.s||"";
  document.getElementById("fh").textContent="Edit supplement";document.getElementById("f-b").textContent="Save";document.getElementById("f-c").hidden=false;document.getElementById("f-n").focus();window.scrollTo(0,0)}
document.getElementById("f-c").onclick=reset;
F.addEventListener("submit",function(ev){ev.preventDefault();
  var v={n:document.getElementById("f-n").value.trim(),a:document.getElementById("f-a").value.trim(),f:document.getElementById("f-f").value.trim(),d:document.getElementById("f-d").value.trim(),s:document.getElementById("f-s").value};
  if(!v.n)return;
  if(editing){S.items=S.items.map(function(i){return i.id===editing?{id:i.id,n:v.n,a:v.a,f:v.f,d:v.d,s:v.s}:i})}else S.items.push({id:uid(),n:v.n,a:v.a,f:v.f,d:v.d,s:v.s});
  save();reset();render()});
render();
})();
</script>

</body></html>
