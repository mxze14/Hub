<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Grocery List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: add row on top, then items grouped by store section with check boxes; bought items fade and can be cleared in one press. Same dark cyberpunk look as the rest of the hub. */
:root{color-scheme:dark;
--bg:#0b0720;--panel:#120a2e;--panel2:#190f3d;--ink:#f3ecff;--mute:#a89cd0;--line:#3a2680;--accent:#b36bff;--cyan:#4de2ff;--hot:#ff4fd8;--lime:#9dff7a;--bad:#ff5c78;--on-accent:#0a0620;
--display:"Chakra Petch",system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:500;font-size:15px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;
background-image:radial-gradient(ellipse at 80% -10%,rgba(179,107,255,.22),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(255,79,216,.12),transparent 50%)}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
h1{margin:0;font-size:26px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 18px rgba(179,107,255,.8),2px 0 rgba(255,79,216,.5),-2px 0 rgba(77,226,255,.4)}
.crumb{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.note{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--mute);border:1px solid var(--line);background:var(--panel);padding:9px 12px}
.note b{color:var(--cyan);font-weight:400}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--accent);padding:8px 14px;color:var(--ink)}
.btn:hover{background:var(--accent);color:var(--on-accent)}
.btn.pri{background:var(--accent);color:var(--on-accent)}.btn.pri:hover{background:var(--cyan);border-color:var(--cyan)}
.btn.ghost{border-color:var(--line);color:var(--mute)}
.btn.sm{padding:4px 9px;font-size:11px;border-color:var(--line);color:var(--mute)}.btn.sm:hover{background:var(--bad);border-color:var(--bad);color:#fff}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-family:var(--mono);font-weight:400}
label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);min-width:0;flex:1 1 100px}
input,select{background:var(--bg);border:1px solid var(--line);padding:8px 10px;min-width:0;width:100%;font-size:15px}
input:focus,select:focus{border-color:var(--cyan);outline:none}
form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);text-align:center}
.ex{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);border:1px dashed var(--mute);padding:0 4px;margin-left:8px;font-weight:400}
.ai{border:1px dashed var(--accent);padding:16px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.ai b{color:var(--ink);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;font-size:12px;font-weight:400}
.legend{font-family:var(--mono);font-size:11px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sec{margin-bottom:14px}
.sec h3{margin:0 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hot);font-weight:400;display:flex;justify-content:space-between}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 12px;background:var(--panel2);border-left:2px solid var(--accent);margin-bottom:4px}
.it.done{opacity:.5;border-left-color:var(--lime)}.it.done .t{text-decoration:line-through}
.it .t{overflow-wrap:anywhere;font-weight:600}.it .q{font-family:var(--mono);color:var(--cyan)}
.it input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
</style>
<div class="wrap">
  <header><h1>Groceries</h1><div class="crumb">Hub / Fitness / Groceries</div></header>
  <div class="note" id="note"></div>
  <div class="card"><h2>Add an item</h2>
    <form class="row" id="f">
      <label style="flex:2 1 200px">Item<input id="n" required placeholder="e.g. Chicken breast"></label>
      <label>Amount<input id="q" placeholder="e.g. 2 lb"></label>
      <label>Section<input id="s" list="sl" placeholder="Protein"></label>
      <datalist id="sl"><option>Produce</option><option>Protein</option><option>Dairy</option><option>Grains</option><option>Pantry</option><option>Frozen</option><option>Drinks</option><option>Other</option></datalist>
      <button class="btn pri" type="submit">Add</button>
    </form></div>
  <div class="card"><h2>Shopping list</h2><div class="bar"><span class="legend" id="cnt"></span><span style="display:flex;gap:8px"><button class="btn ghost" id="un" type="button">Uncheck all</button><button class="btn" id="cl" type="button">Clear checked</button></span></div><div id="list"></div></div>
  <div class="ai"><b>AI suggestions</b>Reserved for your independent AI. Once it is connected it will build this list from your macro targets and meal plan. Nothing is suggested yet.</div>
</div>
<script>
function $(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function uid(){return Math.random().toString(36).slice(2,9)}
function noteBar(S,KEY,clear){var note=document.getElementById("note");note.textContent="";var sp=$("span");sp.innerHTML="Saved in <b>this browser only</b> for now. Everything here is entered by hand.";note.appendChild(sp);
  if(clear.has()){var b=$("button","btn ghost","Clear example data");b.type="button";b.onclick=clear.run;note.appendChild(b)}}
(function(){
var KEY="hub.fitness.groceries.v1",S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
function it(n,q,s,d){return{id:uid(),n:n,q:q,s:s,d:d||0,ex:1}}
if(!S||!S.items)S={items:[it("Chicken breast","3 lb","Protein"),it("Eggs","2 dozen","Protein",1),it("Greek yogurt","1 tub","Dairy"),it("Jasmine rice","5 lb","Grains"),it("Rolled oats","1 canister","Grains"),it("Bananas","1 bunch","Produce"),it("Spinach","2 bags","Produce")]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function has(){return S.items.some(function(i){return i.ex})}
function render(){
  noteBar(S,KEY,{has:has,run:function(){S.items=S.items.filter(function(i){return!i.ex});save();render()}});
  var L=document.getElementById("list");L.textContent="";
  var left=S.items.filter(function(i){return!i.d}).length;document.getElementById("cnt").textContent=S.items.length?left+" to buy · "+(S.items.length-left)+" checked":"";
  if(!S.items.length){L.appendChild($("div","empty","Your list is empty. Add the first item above."));return}
  var secs=[];S.items.forEach(function(i){var s=i.s||"Other";if(secs.indexOf(s)<0)secs.push(s)});
  secs.forEach(function(s){var items=S.items.filter(function(i){return(i.s||"Other")===s}),d=$("div","sec"),h=$("h3");h.appendChild($("span",null,s));h.appendChild($("span",null,String(items.length)));d.appendChild(h);
    items.sort(function(a,b){return a.d-b.d}).forEach(function(i){var r=$("div","it"+(i.d?" done":"")),c=$("input");c.type="checkbox";c.checked=!!i.d;c.setAttribute("aria-label","Bought "+i.n);c.onchange=function(){i.d=c.checked?1:0;save();render()};
      var t=$("div","t",i.n);if(i.ex)t.appendChild($("span","ex","EXAMPLE"));r.appendChild(c);r.appendChild(t);r.appendChild($("div","q",i.q||""));
      var x=$("button","btn sm","Delete");x.type="button";x.setAttribute("aria-label","Delete "+i.n);x.onclick=function(){S.items=S.items.filter(function(y){return y.id!==i.id});save();render()};r.appendChild(x);d.appendChild(r)});L.appendChild(d)})}
document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var v=function(id){return document.getElementById(id).value.trim()};S.items.push({id:uid(),n:v("n"),q:v("q"),s:v("s")||"Other",d:0});save();var s=v("s");this.reset();document.getElementById("s").value=s;render();document.getElementById("n").focus()};
document.getElementById("cl").onclick=function(){S.items=S.items.filter(function(i){return!i.d});save();render()};
document.getElementById("un").onclick=function(){S.items.forEach(function(i){i.d=0});save();render()};
render();
})();
</script>

</body></html>
