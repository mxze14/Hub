<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Money Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: tab row for the four Money apps; each of Assets, Finances and Documentation opens on an overview of every business and clicks into one business. Same dark cyberpunk look as the rest of the hub. */
:root{color-scheme:dark;
--bg:#0b0720;--panel:#120a2e;--panel2:#190f3d;--ink:#f3ecff;--mute:#a89cd0;--line:#3a2680;--accent:#b36bff;--cyan:#4de2ff;--hot:#ff4fd8;--lime:#9dff7a;--bad:#ff5c78;--on-accent:#0a0620;
--display:"Chakra Petch",system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:500;font-size:15px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;
background-image:radial-gradient(ellipse at 80% -10%,rgba(179,107,255,.22),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(255,79,216,.12),transparent 50%)}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
h1{margin:0;font-size:26px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 18px rgba(179,107,255,.8),2px 0 rgba(255,79,216,.5),-2px 0 rgba(77,226,255,.4)}
.crumb{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.note{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--mute);border:1px solid var(--line);background:var(--panel);padding:9px 12px}
.note b{color:var(--cyan);font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--accent);padding:8px 14px;color:var(--ink)}
.btn:hover{background:var(--accent);color:var(--on-accent)}
.btn.pri{background:var(--accent);color:var(--on-accent)}.btn.pri:hover{background:var(--cyan);border-color:var(--cyan)}
.btn.ghost{border-color:var(--line);color:var(--mute)}
.btn.sm{padding:4px 9px;font-size:11px;border-color:var(--line);color:var(--mute)}.btn.sm:hover{background:var(--bad);border-color:var(--bad);color:#fff}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--line);padding:10px 16px;font-weight:600;letter-spacing:.04em}
.tab:hover{border-color:var(--accent)}.tab[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab.off{border-style:dashed;color:var(--mute);cursor:default}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-family:var(--mono);font-weight:400;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);min-width:0;flex:1 1 130px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);padding:8px 10px;min-width:0;width:100%;font-size:15px}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);outline:none}
form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.bz{text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink);min-width:0}
.bz:hover{border-color:var(--accent);border-left-color:var(--cyan)}
.bz .t{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.bz .m{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--hot)}
.bz .d{color:var(--mute);overflow-wrap:anywhere}
.bz .s{font-family:var(--mono);color:var(--cyan);font-variant-numeric:tabular-nums}
.pos{color:var(--lime)}.neg{color:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:400}
td.w{white-space:normal;overflow-wrap:anywhere;min-width:160px}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);text-align:center}
.ex{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);border:1px dashed var(--mute);padding:0 4px;margin-left:8px;font-weight:400}
.bk{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend{font-family:var(--mono);font-size:11px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header><h1>Money</h1><div class="crumb">Hub / Money</div></header>
  <div class="note" id="note"></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Money apps"></div>
  <div id="view" style="display:flex;flex-direction:column;gap:14px"></div>
</div>
<script>
(function(){
var KEY="hub.money.v1",S,TAB="biz",OPEN=null;
function $(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function uid(){return Math.random().toString(36).slice(2,9)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function ago(n){var d=new Date();d.setDate(d.getDate()-n);return iso(d)}
function usd(n){return(n<0?"-":"")+"$"+Math.abs(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}
function fd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"2-digit"})}
function seed(){var a=uid(),b=uid();return{biz:[
 {id:a,name:"Example Plumbing Marketing",kind:"Business",status:"Active",desc:"Example profile. Local SEO and ad management for plumbers.",ex:1},
 {id:b,name:"Example Side Project",kind:"Project",status:"Planning",desc:"Example profile. A small tool I am prototyping.",ex:1}],
 assets:[{id:uid(),biz:a,name:"Laptop",cat:"Equipment",val:1800,date:ago(300),ex:1},{id:uid(),biz:a,name:"Client list",cat:"Intangible",val:5000,date:ago(200),ex:1},{id:uid(),biz:b,name:"Domain name",cat:"Intangible",val:40,date:ago(30),ex:1}],
 fin:[{id:uid(),biz:a,date:ago(40),type:"Income",cat:"Client retainer",amt:2500,ex:1},{id:uid(),biz:a,date:ago(25),type:"Expense",cat:"Ad spend",amt:900,ex:1},{id:uid(),biz:a,date:ago(10),type:"Income",cat:"Client retainer",amt:2500,ex:1},{id:uid(),biz:b,date:ago(20),type:"Expense",cat:"Hosting",amt:25,ex:1}],
 docs:[{id:uid(),biz:a,title:"LLC formation papers",cat:"Formation",date:ago(320),note:"Filed with the state.",ex:1},{id:uid(),biz:a,title:"Q3 report",cat:"Report",date:ago(15),note:"Revenue and ad performance.",ex:1}]}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.biz)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function biz(id){return S.biz.filter(function(b){return b.id===id})[0]}
function field(lbl,id,type,ph,extra){var l=$("label");l.appendChild(document.createTextNode(lbl));var i=$(type==="textarea"?"textarea":"input");i.id=id;if(type!=="textarea")i.type=type;if(ph)i.placeholder=ph;if(type==="number"){i.step="any";i.inputMode="decimal"}if(extra)for(var k in extra)i.setAttribute(k,extra[k]);l.appendChild(i);return l}
function sel(lbl,id,opts){var l=$("label");l.appendChild(document.createTextNode(lbl));var s=$("select");s.id=id;opts.forEach(function(o){var op=$("option",null,o.t||o);op.value=o.v||o;s.appendChild(op)});l.appendChild(s);return l}
function btn(t,c,fn){var b=$("button","btn "+c,t);b.type="button";b.onclick=fn;return b}
function del(arr,id){return btn("Delete","sm",function(){S[arr]=S[arr].filter(function(x){return x.id!==id});save();render()})}
function exT(x){return x.ex?$("span","ex","EXAMPLE"):null}
function sum(arr,f,pred){return S[arr].filter(pred).reduce(function(a,x){return a+f(x)},0)}
function netOf(id){return sum("fin",function(x){return x.type==="Income"?x.amt:-x.amt},function(x){return x.biz===id})}

function bizOptions(){return S.biz.map(function(b){return{v:b.id,t:b.name}})}
function table(heads,rows,numCols){var t=$("table"),h=$("tr");heads.forEach(function(x,i){h.appendChild($("th",numCols.indexOf(i)>-1?"n":null,x))});var th=$("thead");th.appendChild(h);t.appendChild(th);var tb=$("tbody");rows.forEach(function(r){tb.appendChild(r)});t.appendChild(tb);var s=$("div","scroll");s.appendChild(t);return s}
function row(cells,numCols,wideCols){var r=$("tr");cells.forEach(function(c,i){var td=$("td",(numCols.indexOf(i)>-1?"n ":"")+(wideCols&&wideCols.indexOf(i)>-1?"w":""));if(c&&c.nodeType)td.appendChild(c);else td.textContent=c==null?"":c;r.appendChild(td)});return r}

/* generic overview+detail used by Assets, Finances, Documentation */
function overviewApp(cfg){
  var v=document.getElementById("view");
  if(!S.biz.length){v.appendChild($("div","empty","Add a business or project in the Businesses/Projects tab first. This app reads its profiles."));return}
  if(!OPEN||!biz(OPEN)){
    var c=$("div","card"),h=$("h2");h.appendChild($("span",null,cfg.title+" · all businesses"));c.appendChild(h);
    var g=$("div","grid");S.biz.forEach(function(b){var x=$("button","bz");x.type="button";x.onclick=function(){OPEN=b.id;render()};x.appendChild($("div","m",b.kind));x.appendChild($("div","t",b.name));x.appendChild($("div","s",cfg.summary(b.id)));g.appendChild(x)});
    c.appendChild(g);var tot=$("div","legend",cfg.total());tot.style.marginTop="12px";c.appendChild(tot);v.appendChild(c);return}
  var b=biz(OPEN),back=btn("‹ All businesses","ghost",function(){OPEN=null;render()});
  var c=$("div","card"),h=$("h2");h.appendChild($("span",null,b.name+" · "+cfg.title));h.appendChild(back);c.appendChild(h);c.appendChild($("div","s",cfg.summary(b.id)));v.appendChild(c);
  var f=$("div","card");f.appendChild($("h2",null,cfg.addTitle));var form=$("form","row");cfg.fields().forEach(function(x){form.appendChild(x)});var ab=$("button","btn pri","Add");ab.type="submit";form.appendChild(ab);
  form.onsubmit=function(ev){ev.preventDefault();var r=cfg.read(form);if(r){r.id=uid();r.biz=b.id;S[cfg.key].push(r);save();render()}};f.appendChild(form);v.appendChild(f);
  var l=$("div","card");l.appendChild($("h2",null,"Entries"));var rows=S[cfg.key].filter(function(x){return x.biz===b.id}).sort(function(p,q){return p.date<q.date?1:-1});
  l.appendChild(rows.length?table(cfg.heads.concat([""]),rows.map(function(x){return row(cfg.cells(x).concat([del(cfg.key,x.id)]),cfg.num,cfg.wide)}),cfg.num):$("div","empty","Nothing here yet. Add the first entry above."));v.appendChild(l)}

function render(){
  var note=document.getElementById("note");note.textContent="";var sp=$("span");sp.innerHTML="Saved in <b>this browser only</b> for now. Everything here is entered by hand. These four apps share one page so they can read the same business profiles.";note.appendChild(sp);
  var has=["biz","assets","fin","docs"].some(function(k){return S[k].some(function(x){return x.ex})});
  if(has)note.appendChild(btn("Clear example data","ghost",function(){["biz","assets","fin","docs"].forEach(function(k){S[k]=S[k].filter(function(x){return!x.ex})});OPEN=null;save();render()}));
  var T=document.getElementById("tabs");T.textContent="";
  [["biz","Businesses/Projects"],["assets","Business Assets"],["fin","Business Finances"],["docs","Business Documentation"]].forEach(function(t){var b=$("button","tab",t[1]);b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",TAB===t[0]?"true":"false");b.onclick=function(){TAB=t[0];OPEN=null;render()};T.appendChild(b)});
  ["News page","Document breakdown","Research"].forEach(function(n){var b=$("span","tab off",n+" · later");b.title="Needs the AI or outside connections, so it is not built yet.";T.appendChild(b)});
  var v=document.getElementById("view");v.textContent="";
  if(TAB==="biz")return bizView(v);
  if(TAB==="assets")return overviewApp({title:"Business Assets",key:"assets",addTitle:"Add an asset",heads:["Asset","Category","Value","Acquired"],num:[2],wide:[0],
    summary:function(id){var a=S.assets.filter(function(x){return x.biz===id});return a.length+" assets · "+usd(a.reduce(function(s,x){return s+x.val},0))},
    total:function(){return"Total across everything: "+usd(sum("assets",function(x){return x.val},function(){return 1}))},
    fields:function(){return[field("Asset","a-n","text","e.g. Laptop",{required:"required"}),field("Category","a-c","text","Equipment"),field("Value ($)","a-v","number","0",{required:"required"}),field("Acquired","a-d","date","",{value:iso(new Date())})]},
    read:function(f){return{name:f.querySelector("#a-n").value.trim(),cat:f.querySelector("#a-c").value.trim()||"Other",val:parseFloat(f.querySelector("#a-v").value)||0,date:f.querySelector("#a-d").value||iso(new Date())}},
    cells:function(x){return[x.name,x.cat,usd(x.val),fd(x.date)]}});
  if(TAB==="fin")return overviewApp({title:"Business Finances",key:"fin",addTitle:"Add income or an expense",heads:["Date","Type","Category","Amount"],num:[3],wide:[2],
    summary:function(id){var i=sum("fin",function(x){return x.amt},function(x){return x.biz===id&&x.type==="Income"}),e=sum("fin",function(x){return x.amt},function(x){return x.biz===id&&x.type==="Expense"});return"In "+usd(i)+" · Out "+usd(e)+" · Net "+usd(i-e)},
    total:function(){var n=S.biz.reduce(function(s,b){return s+netOf(b.id)},0);return"Net across everything: "+usd(n)},
    fields:function(){return[sel("Type","f-t",["Income","Expense"]),field("Category","f-c","text","e.g. Client retainer"),field("Amount ($)","f-a","number","0",{required:"required"}),field("Date","f-d","date","",{value:iso(new Date())})]},
    read:function(f){var a=parseFloat(f.querySelector("#f-a").value);if(isNaN(a))return null;return{type:f.querySelector("#f-t").value,cat:f.querySelector("#f-c").value.trim()||"General",amt:Math.abs(a),date:f.querySelector("#f-d").value||iso(new Date())}},
    cells:function(x){var s=$("span",x.type==="Income"?"pos":"neg",(x.type==="Income"?"+":"-")+usd(x.amt));return[fd(x.date),x.type,x.cat,s]}});
  overviewApp({title:"Business Documentation",key:"docs",addTitle:"Add a document record",heads:["Date","Document","Kind","Notes"],num:[],wide:[1,3],
    summary:function(id){return S.docs.filter(function(x){return x.biz===id}).length+" documents"},
    total:function(){return S.docs.length+" documents in total. Files themselves will live in the hub Documents storage once it exists. For now this keeps the record."},
    fields:function(){return[field("Title","d-t","text","e.g. LLC formation papers",{required:"required"}),sel("Kind","d-k",["Formation","Presentation","Report","Contract","Other"]),field("Date","d-d","date","",{value:iso(new Date())}),field("Notes","d-n","text","Where it is, what it covers")]},
    read:function(f){return{title:f.querySelector("#d-t").value.trim(),cat:f.querySelector("#d-k").value,date:f.querySelector("#d-d").value||iso(new Date()),note:f.querySelector("#d-n").value.trim()}},
    cells:function(x){var t=$("span",null,x.title);if(x.ex)t.appendChild($("span","ex","EXAMPLE"));return[fd(x.date),t,x.cat,x.note||""]}});
}
function bizView(v){
  var c=$("div","card");c.appendChild($("h2",null,"Add a business or project"));
  var form=$("form","row");[field("Name","b-n","text","e.g. Plumbing marketing agency",{required:"required"}),sel("Kind","b-k",["Business","Project"]),sel("Status","b-s",["Active","Planning","Paused","Closed"])].forEach(function(x){form.appendChild(x)});
  var d=field("Description","b-d","textarea","What it is and what it does");d.style.flex="1 1 100%";form.appendChild(d);var ab=$("button","btn pri","Create profile");ab.type="submit";form.appendChild(ab);
  form.onsubmit=function(ev){ev.preventDefault();S.biz.push({id:uid(),name:form.querySelector("#b-n").value.trim(),kind:form.querySelector("#b-k").value,status:form.querySelector("#b-s").value,desc:form.querySelector("#b-d").value.trim()});save();render()};c.appendChild(form);v.appendChild(c);
  var l=$("div","card");l.appendChild($("h2",null,"Profiles ("+S.biz.length+")"));
  if(!S.biz.length)l.appendChild($("div","empty","No profiles yet. Create your first business or project above."));
  else{var g=$("div","grid");S.biz.forEach(function(b){var x=$("div","bz");x.appendChild($("div","m",b.kind+" · "+b.status));var t=$("div","t",b.name);if(b.ex)t.appendChild($("span","ex","EXAMPLE"));x.appendChild(t);x.appendChild($("div","d",b.desc||"No description yet."));
    x.appendChild($("div","s",S.assets.filter(function(a){return a.biz===b.id}).length+" assets · net "+usd(netOf(b.id))+" · "+S.docs.filter(function(a){return a.biz===b.id}).length+" docs"));
    var a=$("div","bk");a.appendChild(btn("Edit","ghost",function(){editB(b)}));a.appendChild(btn("Delete","sm",function(){["assets","fin","docs"].forEach(function(k){S[k]=S[k].filter(function(y){return y.biz!==b.id})});S.biz=S.biz.filter(function(y){return y.id!==b.id});save();render()}));x.appendChild(a);g.appendChild(x)});l.appendChild(g);l.appendChild($("div","legend","Deleting a profile also removes its assets, finances and documentation records.")).style.marginTop="12px"}
  v.appendChild(l)}
function editB(b){var v=document.getElementById("view");v.textContent="";var c=$("div","card");c.appendChild($("h2",null,"Edit "+b.name));var f=$("form","row");
  var n=field("Name","e-n","text","");n.querySelector("input").value=b.name;var k=sel("Kind","e-k",["Business","Project"]);k.querySelector("select").value=b.kind;var s=sel("Status","e-s",["Active","Planning","Paused","Closed"]);s.querySelector("select").value=b.status;
  var d=field("Description","e-d","textarea","");d.querySelector("textarea").value=b.desc||"";d.style.flex="1 1 100%";[n,k,s,d].forEach(function(x){f.appendChild(x)});
  var sv=$("button","btn pri","Save");sv.type="submit";f.appendChild(sv);f.appendChild(btn("Cancel","ghost",render));
  f.onsubmit=function(ev){ev.preventDefault();b.name=f.querySelector("#e-n").value.trim()||b.name;b.kind=f.querySelector("#e-k").value;b.status=f.querySelector("#e-s").value;b.desc=f.querySelector("#e-d").value.trim();save();render()};c.appendChild(f);v.appendChild(c)}
render();
})();
</script>

</body></html>
